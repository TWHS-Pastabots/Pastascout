name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Also targets the github-pages environment (same as the deploy job below)
    # so this job can see API_URL whether it was added as a plain repository
    # variable or as one scoped to the github-pages environment specifically —
    # GitHub has both, and they're easy to mix up.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npm run build -w @frc-scout/shared

      - name: Check API_URL is visible to this job
        # API_URL is just a public server address, not a secret — safe to print.
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::warning::API_URL is empty in this job — the client will build with no backend configured. Check Settings > Secrets and variables > Actions > Variables (not Environments)."
          else
            echo "API_URL = ${{ vars.API_URL }}"
          fi

      - name: Build client
        # VITE_BASE_PATH matches this project's Pages URL (username.github.io/repo-name/).
        # VITE_API_URL is a repo variable (Settings > Secrets and variables > Actions >
        # Variables) — set it once the server's deployed. Until then the client falls
        # back to its dev-mode default, which won't reach a real backend from Pages.
        run: npm run build -w @frc-scout/client
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
